name: 'Publish and Release'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare ASR DLL
        shell: pwsh
        run: |
          $version = "1.13.1"
          # 修正文件名：版本号前带 v
          $filename = "sherpa-onnx-v$version-win-x64-shared-MD-Release"
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$filename.tar.bz2"
          
          Write-Host "Downloading from $url..."
          Invoke-WebRequest -Uri $url -OutFile "sherpa.tar.bz2"
          
          Write-Host "Extracting..."
          tar -xf sherpa.tar.bz2
          
          if (-not (Test-Path "src-tauri/bin/win64")) {
              mkdir -p src-tauri/bin/win64
          }
          
          # 扫荡式抓取：获取解压目录下的所有 DLL 和 LIB
          $extracted_dir = Get-ChildItem -Path "sherpa-onnx-*" -Directory | Select-Object -First 1
          if ($extracted_dir) {
              Write-Host "Found extracted directory: $($extracted_dir.FullName)"
              Get-ChildItem -Path $extracted_dir.FullName -Filter "*.dll" -Recurse | Copy-Item -Destination "src-tauri/bin/win64/" -Force
              Get-ChildItem -Path $extracted_dir.FullName -Filter "*.lib" -Recurse | Copy-Item -Destination "src-tauri/bin/win64/" -Force
              Write-Host "All DLLs and LIBs have been copied to bin/win64."
          } else {
              Write-Error "Could not find extracted directory!"
              exit 1
          }
          Write-Host "ASR Infrastructure preparation complete."

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'My App v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
